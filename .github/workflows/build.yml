name: Build TenviTest MP
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout tenvi-mp (modified source)
        uses: actions/checkout@v4
        with:
          repository: ETboy-debug/tenvi-mp
          path: src
      - name: Checkout Riremito/tools (Share libs)
        uses: actions/checkout@v4
        with:
          repository: Riremito/tools
          path: tools
      - name: Checkout Riremito/tv_xml (game data)
        uses: actions/checkout@v4
        with:
          repository: Riremito/tv_xml
          path: tv_xml
      - name: Copy Share libs into source
        shell: cmd
        run: |
          if not exist src\AutoResponse\Share\Simple mkdir src\AutoResponse\Share\Simple
          if not exist src\AutoResponse\Share\Hook mkdir src\AutoResponse\Share\Hook
          xcopy /Y tools\Simple\*.* src\AutoResponse\Share\Simple\
          xcopy /Y tools\Hook\*.* src\AutoResponse\Share\Hook\
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Build AutoResponse (client inject dll)
        shell: cmd
        run: msbuild src\AutoResponse\AutoResponse.vcxproj /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0.22621.0 /m
      - name: Build RunEmuTenvi (injector)
        shell: cmd
        run: msbuild src\RunEmuTenvi\RunEmuTenvi.vcxproj /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0.22621.0 /m
      - name: Build StandaloneServer
        shell: cmd
        run: msbuild src\StandaloneServer\StandaloneServer.vcxproj /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0.22621.0 /m
      - name: Collect outputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist -Force
          Get-ChildItem -Path src\AutoResponse -Recurse -Include AutoResponse.dll | ForEach-Object { Copy-Item $_.FullName -Destination dist\AutoResponse.dll -Force }
          Get-ChildItem -Path src\RunEmuTenvi -Recurse -Include RunEmuTenvi.exe | ForEach-Object { Copy-Item $_.FullName -Destination dist\RunEmuTenvi.exe -Force }
          Get-ChildItem -Path src\StandaloneServer -Recurse -Include StandaloneServer.exe | ForEach-Object { Copy-Item $_.FullName -Destination dist\StandaloneServer.exe -Force }
          Copy-Item src\RunEmuTenvi.ini -Destination dist\RunEmuTenvi.ini -Force
          Copy-Item src\RunEmuTenvi_CN.ini -Destination dist\RunEmuTenvi_CN.ini -Force
          if (Test-Path tv_xml\CN) { Copy-Item -Recurse -Force tv_xml\CN dist\tv_xml\CN }
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\* -DestinationPath tenvi-mp.zip -Force
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mp-latest
          files: tenvi-mp.zip
          overwrite: true
          body: "TenviTest MP milestone1: client dll (ConnectCaller real-connect) + standalone server StandaloneServer.exe. 启动顺序: 先开 StandaloneServer.exe (监听 8787), 再开 RunEmuTenvi.exe 注入客户端。"
